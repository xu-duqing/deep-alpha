[project]
name = "deep-alpha"
version = "0.1.0"
description = "CLI for downloading, updating, and querying offline Qlib market data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
]

[project.optional-dependencies]
qlib = ["pyqlib"]
test = ["pytest>=7"]

[project.scripts]
deep-alpha = "deep_alpha.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
